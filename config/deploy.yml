# Deploy with Kamal 2 (https://kamal-deploy.org) to any Linux server with Docker:
#
#   export KAMAL_SERVER=203.0.113.10 APP_HOST=undefeatedfc.example.com
#   export KAMAL_REGISTRY_USERNAME=you KAMAL_REGISTRY_PASSWORD=... POSTGRES_PASSWORD=...
#   bin/kamal setup     # first time: installs Docker, boots Postgres and the app
#   bin/kamal deploy    # afterwards
#
# One server runs Puma, with Solid Queue's supervisor inside it
# (SOLID_QUEUE_IN_PUMA), and a Postgres 16 accessory holds the app, cache,
# queue and cable databases. kamal-proxy issues the TLS certificate.

service: undefeated_fc
image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "undefeated_fc") %>/undefeated_fc

servers:
  web:
    - <%= ENV.fetch("KAMAL_SERVER", "192.0.2.1") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "undefeatedfc.example.com") %>
  healthcheck:
    path: /up

registry:
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "undefeated_fc") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - UNDEFEATED_FC_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: undefeated_fc-db
    APP_HOST: <%= ENV.fetch("APP_HOST", "undefeatedfc.example.com") %>

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("KAMAL_SERVER", "192.0.2.1") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: undefeated_fc
        POSTGRES_DB: undefeated_fc_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

asset_path: /rails/public/assets

builder:
  arch: amd64
